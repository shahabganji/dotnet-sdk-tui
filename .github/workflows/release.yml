name: Release

# publish (6 RIDs) -> smoke (install + TUI + full flow on every OS/arch) -> release
# The GitHub Release is only created if every smoke test passes. Run it manually
# (workflow_dispatch) from any branch for a dry run: publish + smoke, no release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build (X.Y.Z)
        type: string
        default: '0.0.0'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}

  smoke:
    needs: [version, publish]
    uses: ./.github/workflows/smoke.yml
    with:
      source: artifacts
      version: ${{ needs.version.outputs.version }}
      full: true

  release:
    needs: [publish, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history + tags to find the previous version

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: dotnet-sdk-tui-*
          merge-multiple: true

      - name: Generate release notes (changes since the previous tag)
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/generate_release_notes.sh notes.md
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: artifacts/*

  # Not a gate (the release already exists): verifies what users actually run —
  # the public one-liners downloading the just-published assets.
  verify-release:
    needs: [version, release]
    uses: ./.github/workflows/smoke.yml
    with:
      source: release
      version: ${{ needs.version.outputs.version }}
