name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.xml'

  # Publish the real NativeAOT archives for every RID, then install them through the
  # install scripts and drive the installed binary's TUI on each OS/arch.
  publish:
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      version: 0.0.${{ github.run_number }}

  smoke:
    needs: publish
    uses: ./.github/workflows/smoke.yml
    with:
      source: artifacts
      version: 0.0.${{ github.run_number }}
      full: ${{ github.event_name == 'push' }}
