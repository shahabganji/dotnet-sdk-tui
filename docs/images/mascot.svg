<?xml version="1.0" encoding="UTF-8"?>
<!--
  dsm icon: an isometric stack of rounded ".NET SDK" tiles, matching the landing-page hero
  (docs/assets/landing.css .stack-scene: rotateX(57deg) rotateZ(-45deg), border-radius 22%).
  Each layer = extruded side (edge colour) + top face (gradient). scale(1,.545) = cos(57deg).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="24 26 152 152" width="152" height="152" role="img" aria-label=".NET SDK Manager icon">
  <defs>
    <rect id="tile" x="-55" y="-55" width="110" height="110" rx="24"/>
    <linearGradient id="g0" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E6B5E"/><stop offset="1" stop-color="#0B4F47"/></linearGradient>
    <linearGradient id="g1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#139A85"/><stop offset="1" stop-color="#0E6F61"/></linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FC7A9"/><stop offset="1" stop-color="#17A58E"/></linearGradient>
    <linearGradient id="g3" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8E64D"/><stop offset="1" stop-color="#7CC94D"/></linearGradient>
    <linearGradient id="g4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3FBD8"/><stop offset="0.55" stop-color="#D9F09A"/><stop offset="1" stop-color="#B5DC6A"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <ellipse cx="100" cy="166" rx="62" ry="12" fill="#000" opacity="0.35" filter="url(#blur)"/>

  <!-- layer 0 (bottom, darkest teal) -->
  <use xlink:href="#tile" href="#tile" fill="#062E29" transform="translate(100 139) scale(1 .545) rotate(-45)"/>
  <rect x="32.2" y="130" width="135.6" height="9" fill="#062E29"/>
  <use xlink:href="#tile" href="#tile" fill="url(#g0)" transform="translate(100 130) scale(1 .545) rotate(-45)"/>

  <!-- layer 1 -->
  <use xlink:href="#tile" href="#tile" fill="#094A41" transform="translate(100 124) scale(1 .545) rotate(-45)"/>
  <rect x="32.2" y="115" width="135.6" height="9" fill="#094A41"/>
  <use xlink:href="#tile" href="#tile" fill="url(#g1)" transform="translate(100 115) scale(1 .545) rotate(-45)"/>

  <!-- layer 2 (teal) -->
  <use xlink:href="#tile" href="#tile" fill="#0F7465" transform="translate(100 109) scale(1 .545) rotate(-45)"/>
  <rect x="32.2" y="100" width="135.6" height="9" fill="#0F7465"/>
  <use xlink:href="#tile" href="#tile" fill="url(#g2)" transform="translate(100 100) scale(1 .545) rotate(-45)"/>

  <!-- layer 3 (lime) -->
  <use xlink:href="#tile" href="#tile" fill="#5E9A2F" transform="translate(100 94) scale(1 .545) rotate(-45)"/>
  <rect x="32.2" y="85" width="135.6" height="9" fill="#5E9A2F"/>
  <use xlink:href="#tile" href="#tile" fill="url(#g3)" transform="translate(100 85) scale(1 .545) rotate(-45)"/>

  <!-- layer 4 (top, frosted glass with the .NET SDK label) -->
  <use xlink:href="#tile" href="#tile" fill="#A9E8D8" transform="translate(100 79) scale(1 .545) rotate(-45)"/>
  <rect x="32.2" y="70" width="135.6" height="9" fill="#A9E8D8"/>
  <g transform="translate(100 70) scale(1 .545) rotate(-45)">
    <use xlink:href="#tile" href="#tile" fill="url(#g4)"/>
    <rect x="-46" y="-46" width="92" height="92" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="-1" fill="#0B3B34">.NET</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#0B3B34" fill-opacity="0.8">SDK</text>
  </g>
</svg>
