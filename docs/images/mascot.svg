<?xml version="1.0" encoding="UTF-8"?>
<!--
  dsm mascot — an original rocket in the brand teal + lime palette.
  Sleek cylindrical body with a lime nose cap, brand-lime porthole with the
  "dsm" wordmark on the fuselage, angled fins, and a lime flame trail.
  Brand palette:
    #C8E64D  lime accent (nose, porthole, flame)
    #9BC02E  darker lime shadow
    #3FDBBC  bright teal (highlights)
    #1DB9A0  brand teal (fuselage)
    #148F7B  deeper teal shadow
    #0F7A68  darkest teal
    #062822  near-black teal (outlines)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="dsm rocket mascot">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7A68"/>
      <stop offset="0.5" stop-color="#3FDBBC"/>
      <stop offset="1" stop-color="#148F7B"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2F58C"/>
      <stop offset="1" stop-color="#9BC02E"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#148F7B"/>
      <stop offset="1" stop-color="#0F7A68"/>
    </linearGradient>
    <radialGradient id="port" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#F4FFB8"/>
      <stop offset="0.5" stop-color="#C8E64D"/>
      <stop offset="1" stop-color="#8FA82F"/>
    </radialGradient>
    <linearGradient id="flame1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2F58C"/>
      <stop offset="0.6" stop-color="#C8E64D"/>
      <stop offset="1" stop-color="#8FA82F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FDBBC"/>
      <stop offset="1" stop-color="#1DB9A0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- exhaust glow behind flame -->
  <ellipse cx="200" cy="470" rx="90" ry="40" fill="#C8E64D" opacity="0.35" filter="url(#soft)"/>

  <!-- outer flame (teal) -->
  <path d="M 138 400
           Q 154 458 176 486
           Q 200 512 224 486
           Q 246 458 262 400 Z"
        fill="url(#flame2)" opacity="0.9"/>

  <!-- inner flame (lime) -->
  <path d="M 150 400
           Q 168 448 184 472
           Q 200 494 216 472
           Q 232 448 250 400 Z"
        fill="url(#flame1)"/>

  <!-- inner-inner flame highlight -->
  <path d="M 172 400
           Q 184 434 194 452
           Q 200 462 206 452
           Q 216 434 228 400 Z"
        fill="#F4FFB8" opacity="0.85"/>

  <!-- fins -->
  <path d="M 108 340
           L 84 410
           L 148 400
           L 152 340 Z"
        fill="url(#fin)" stroke="#062822" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 292 340
           L 316 410
           L 252 400
           L 248 340 Z"
        fill="url(#fin)" stroke="#062822" stroke-width="5" stroke-linejoin="round"/>
  <!-- fin highlights -->
  <path d="M 116 350 L 100 396" stroke="#3FDBBC" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <path d="M 288 350 L 304 396" stroke="#3FDBBC" stroke-width="3" opacity="0.7" stroke-linecap="round"/>

  <!-- fuselage -->
  <path d="M 148 110
           Q 148 100 158 100
           L 242 100
           Q 252 100 252 110
           L 252 400
           Q 252 412 240 412
           L 160 412
           Q 148 412 148 400 Z"
        fill="url(#body)" stroke="#062822" stroke-width="5" stroke-linejoin="round"/>

  <!-- body seam / highlight along the left -->
  <path d="M 164 116 L 164 400" stroke="#5DE6C9" stroke-width="4" opacity="0.55" stroke-linecap="round"/>
  <path d="M 236 116 L 236 400" stroke="#062822" stroke-width="2" opacity="0.35"/>

  <!-- rings around the body -->
  <line x1="148" y1="196" x2="252" y2="196" stroke="#062822" stroke-width="3" opacity="0.7"/>
  <line x1="148" y1="332" x2="252" y2="332" stroke="#062822" stroke-width="3" opacity="0.7"/>

  <!-- porthole with dsm wordmark -->
  <circle cx="200" cy="256" r="46" fill="url(#port)" stroke="#062822" stroke-width="5"/>
  <circle cx="200" cy="256" r="38" fill="none" stroke="#8FA82F" stroke-width="2" opacity="0.7"/>
  <!-- glass shine -->
  <path d="M 176 232 Q 188 220 208 224" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <text x="200" y="266" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="22" font-weight="700" fill="#062822" letter-spacing="2">dsm</text>

  <!-- rivets -->
  <g fill="#062822" opacity="0.8">
    <circle cx="160" cy="140" r="3"/>
    <circle cx="240" cy="140" r="3"/>
    <circle cx="160" cy="380" r="3"/>
    <circle cx="240" cy="380" r="3"/>
  </g>

  <!-- nose cone -->
  <path d="M 148 110
           Q 200 20 252 110 Z"
        fill="url(#nose)" stroke="#062822" stroke-width="5" stroke-linejoin="round"/>
  <!-- nose tip highlight -->
  <path d="M 200 40 Q 178 68 168 100" fill="none" stroke="#F4FFB8" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <!-- nose seam -->
  <path d="M 200 24 L 200 108" stroke="#062822" stroke-width="2" opacity="0.4"/>
</svg>
